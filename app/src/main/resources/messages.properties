# =====================================================================
# Smart Grievance - message catalogue (draft, doc 12 §8, D77-D79)
#
# Copy to app/src/main/resources/messages.properties (UTF-8, no BOM).
# English only; the application always resolves messages with
# Locale.ENGLISH (FixedLocaleResolver), so no other bundle is ever used.
#
# Key convention:  <kind>.<area>.<detail>   (lower camelCase segments)
#   validation.*  error shown ON A FORM (field or global); the user can fix it
#                 by changing the input. Bean Validation, binding, service checks.
#   typeMismatch* Spring's fixed binding codes (conversion failures).
#   form.*        texts of the form frame (error summary, choose files again)
#   error.*       refusal: the request is refused whatever the input
#                 (flashError after a redirect, notice on the detail page,
#                 or a page-level alert)
#   flash.*       success / info messages after a redirect (PRG)
#   login.*       alerts on the login page (query flags)
#   notice.*      notices and banners produced by the server
#   confirm.*     JavaScript confirm prompts (rendered into data-confirm)
#   notify.*      notification templates (rendered once and stored, BR-69)
#   page.error.*  error pages
#
# Writing rules (checked by docs/specs/verify/check-12-messages.py):
#   * Apostrophes are written as U+2019 (’), never as ASCII ', so MessageFormat
#     quoting never matters.
#   * Bean Validation messages may use {min} / {max}; all other messages use
#     MessageFormat arguments {0}, {1} ... A message never mixes both kinds.
#   * No HTML. Values are escaped by th:text like any other text (NFR-07).
#   * Plain English, short sentences, no exclamation marks (doc 10 §8.1).
# =====================================================================

