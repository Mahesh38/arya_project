# =====================================================================
# local profile (D130): run on a laptop with no database server.
#   java -jar smart-grievance.jar --spring.profiles.active=local
#   (or docs/deploy/scripts/run-local.sh / run-local.bat)
# Embedded H2 database in a file, Appendix A demo data on the first start,
# everything kept under ./local-data (change with LOCAL_DATA_DIR).
# Never combine with prod: ProdEnvironmentCheck and ProdSafetyCheck refuse it.
# =====================================================================
spring.datasource.url=jdbc:h2:file:${LOCAL_DATA_DIR:./local-data}/db/smart-grievance;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

app.upload.dir=${LOCAL_DATA_DIR:./local-data}/uploads
logging.file.path=${LOCAL_DATA_DIR:./local-data}/logs

# same demo behaviour as the dev profile
app.otp.sender=demo
app.complaint.auto-close-cron=0 */5 * * * *
server.port=${SERVER_PORT:8080}
