<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head><title>All Complaints</title></head>
<body>
<section layout:fragment="content">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
        <h1 class="h3 mb-0">All Complaints</h1>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{${exportUrl}}" download>

    </div>
    <div th:replace="~{fragments/staff-complaint-list :: staffList(true)}"></div>
</section>
</body>
</html>
