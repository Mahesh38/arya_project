<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head><title th:text="${#fields.hasErrors('${form.*}') ? #messages.msg('form.errors.pageTitle', 'Reset password') : 'Reset password'}">Reset password</title></head>
<body>
<nav layout:fragment="breadcrumb" aria-label="Breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{${backUrl}}" th:text="${backUrl.endsWith('/officers') ? 'Officers' : 'Citizens'}"></a></li>
        <li class="breadcrumb-item active" aria-current="page">Reset password</li>
    </ol>
</nav>
<section layout:fragment="content">
    <h1 class="h3 mb-3">Reset password</h1>
    <p>Set a new password for <strong th:text="${user.fullName}"></strong> (<span th:text="${user.email}"></span>).</p>
    <form class="admin-edit-form" method="post" th:object="${form}" th:action="@{${backUrl + '/' + user.id + '/password'}}">
        <div th:replace="~{fragments/form :: errorSummary(${ {'newPassword', 'confirmPassword'} })}"></div>
        <p class="small text-body-secondary">* required</p>
        <div th:replace="~{fragments/form :: password('newPassword', 'New password', 'At least 8 characters with a letter and a digit', 'new-password')}"></div>
        <div th:replace="~{fragments/form :: password('confirmPassword', 'Confirm password', null, 'new-password')}"></div>
        <p class="small text-body-secondary">Give the new password to the user in person. They can change it after login.</p>
        <button type="submit" class="btn btn-primary"><i class="bi bi-key" aria-hidden="true"></i> Reset password</button>
        <a class="btn btn-link" th:href="@{${backUrl}}">Cancel</a>
    </form>
</section>
</body>
</html>
