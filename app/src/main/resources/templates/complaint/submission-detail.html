<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head><title th:text="${complaint.complaintNo}">Complaint</title></head>
<body>
<nav layout:fragment="breadcrumb" aria-label="Breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{${homeUrl}}">Home</a></li>
        <li class="breadcrumb-item active font-monospace" aria-current="page" th:text="${complaint.complaintNo}"></li>
    </ol>
</nav>
<section layout:fragment="content">
    <p class="complaint-no font-monospace fw-semibold mb-1" th:text="${complaint.complaintNo}"></p>
    <h1 class="h3" th:text="${complaint.title}"></h1>
    <div th:replace="~{fragments/complaint-summary :: meta(${complaint})}"></div>
    <div class="d-flex flex-wrap gap-2 my-3" th:if="${canEdit or canWithdraw}">
        <a th:if="${canEdit}" class="btn btn-outline-secondary"
           th:href="@{/citizen/complaints/{no}/edit(no=${complaint.complaintNo})}">
            <i class="bi bi-pencil" aria-hidden="true"></i> Edit
        </a>
        <a th:if="${canWithdraw}" class="btn btn-outline-danger"
           th:href="@{/citizen/complaints/{no}/withdraw(no=${complaint.complaintNo})}">
            <i class="bi bi-arrow-return-left" aria-hidden="true"></i> Withdraw
        </a>
    </div>
    <section class="mt-4" th:unless="${currentAttachments.isEmpty()}">
        <h2 class="h5">Attachments</h2>
        <ul th:replace="~{fragments/attachments :: names(${currentAttachments})}"></ul>
    </section>
</section>
</body>
</html>
