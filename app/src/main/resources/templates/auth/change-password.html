<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title th:text="${#fields.hasErrors('${form.*}') ? #messages.msg('form.errors.pageTitle', 'Change password') : 'Change password'}">Change password</title>
</head>
<body>
<nav aria-label="breadcrumb" layout:fragment="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{${homeUrl}}">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Change password</li>
    </ol>
</nav>
<section class="row" layout:fragment="content">
    <div class="col-lg-6">
        <h1 class="h3 mb-3">Change password</h1>
        <form method="post" th:action="@{/account/password}" th:object="${form}">
            <div th:replace="~{fragments/form :: errorSummary(${ {'currentPassword', 'newPassword', 'confirmPassword'} })}"></div>
            <p class="small text-body-secondary">* required</p>
            <div th:replace="~{fragments/form :: password('currentPassword', 'Current password', null, 'current-password')}"></div>
            <div th:replace="~{fragments/form :: password('newPassword', 'New password', 'At least 8 characters with a letter and a digit', 'new-password')}"></div>
            <div th:replace="~{fragments/form :: password('confirmPassword', 'Confirm new password', null, 'new-password')}"></div>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-key" aria-hidden="true"></i> Change password
            </button>
            <a class="btn btn-link" th:href="@{${homeUrl}}">Cancel</a>
        </form>
    </div>
</section>
</body>
</html>
