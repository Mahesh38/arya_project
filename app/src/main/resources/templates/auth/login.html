<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public}">
<head><title>Log in</title></head>
<body>
<div class="card-body p-4" layout:fragment="content">
    <h1 class="h3 mb-3">Log in</h1>
    <div th:replace="~{fragments/alerts :: message(${loginError ? #messages.msg('login.error') : null}, 'danger', 'bi-exclamation-triangle-fill', 'alert')}"></div>
    <div th:replace="~{fragments/alerts :: message(${accountLocked ? #messages.msg('login.locked', lockMinutes) : null}, 'danger', 'bi-exclamation-triangle-fill', 'alert')}"></div>
    <div th:replace="~{fragments/alerts :: message(${accountInactive ? #messages.msg('login.inactive') : null}, 'danger', 'bi-exclamation-triangle-fill', 'alert')}"></div>
    <div th:replace="~{fragments/alerts :: message(${sessionExpired ? #messages.msg('login.expired') : null}, 'info', 'bi-info-circle-fill', 'status')}"></div>
    <div th:replace="~{fragments/alerts :: message(${loggedOut ? #messages.msg('login.logout') : null}, 'success', 'bi-check-circle-fill', 'status')}"></div>
    <form method="post" th:action="@{/login}">
        <p class="small text-body-secondary">* required</p>
        <div class="mb-3">
            <label class="form-label" for="email">Email <span aria-hidden="true">*</span></label>
            <input id="email" name="email" type="email" class="form-control" autocomplete="username"
                   maxlength="254" required th:value="${form.email}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password <span aria-hidden="true">*</span></label>
            <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Log in
        </button>
    </form>
    <p class="mt-3 mb-2">New citizen? <a th:href="@{/register}">Register</a></p>
    <p class="mb-0 small text-body-secondary">Forgot your password? Contact the Grievance Cell office to reset it.</p>
</div>
</body>
</html>
