<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="errorSummary(fields)" th:if="${#fields.hasAnyErrors()}" id="error-summary" data-error-summary
     class="alert alert-danger" role="alert" tabindex="-1" aria-labelledby="error-summary-title">
  <h2 id="error-summary-title" class="h6" th:text="#{form.errors.title(${#fields.allErrors().size()})}"></h2>
  <ul>
    <li th:each="e : ${#fields.globalErrors()}" th:text="${e}"></li>
    <th:block th:each="f : ${fields}">
      <li th:each="e : ${#fields.errors(f)}"><a th:href="|#${f}|" th:text="${e}"></a></li>
    </th:block>
    <th:block th:each="d : ${#fields.detailedErrors()}">
      <li th:if="${!d.global and !#lists.contains(fields, d.fieldName)}" th:text="${d.message}"></li>
    </th:block>
  </ul>
</div>
<th:block th:fragment="helpText(field, help)">
    <div th:if="${help != null and !help.isEmpty()}" class="form-text" th:id="${field + '-help'}" th:text="${help}"></div>
    <div th:if="${#fields.hasErrors(field)}" class="invalid-feedback d-block" th:id="${field + '-error'}"
         th:errors="*{__${field}__}"></div>
</th:block>
<th:block th:fragment="text(field, label, type, help, required)">
    <div th:replace="~{:: accountField(${field}, ${label}, ${type}, ${help}, ${required}, null, null, null)}"></div>
</th:block>
<div class="mb-3" th:fragment="accountField(field, label, type, help, required, autocomplete, max, inputMode)">
    <label class="form-label" th:for="${field}">
        <span th:text="${label}"></span><span th:if="${required}" aria-hidden="true"> *</span>
    </label>
    <input class="form-control" th:type="${type}" th:field="*{__${field}__}"
           th:required="${required}" th:errorclass="is-invalid" th:maxlength="${max}"
           th:attr="autocomplete=${autocomplete}, inputmode=${inputMode}, aria-invalid=${#fields.hasErrors(field) ? 'true' : null},
                    aria-describedby=${help != null and !help.isEmpty() ? field + '-help' + (#fields.hasErrors(field) ? ' ' + field + '-error' : '') : (#fields.hasErrors(field) ? field + '-error' : null)}">
    <th:block th:replace="~{:: helpText(${field}, ${help})}"></th:block>
</div>
<div class="mb-3" th:fragment="password(field, label, help, autocomplete)">
    <label class="form-label" th:for="${field}"><span th:text="${label}"></span> <span aria-hidden="true">*</span></label>
    <input type="password" class="form-control" th:field="*{__${field}__}" th:autocomplete="${autocomplete}"
           required th:maxlength="${autocomplete == 'new-password' ? 128 : null}" th:errorclass="is-invalid"
           th:attr="aria-invalid=${#fields.hasErrors(field) ? 'true' : null},
                    aria-describedby=${help != null and !help.isEmpty() ? field + '-help' + (#fields.hasErrors(field) ? ' ' + field + '-error' : '') : (#fields.hasErrors(field) ? field + '-error' : null)}">
    <th:block th:replace="~{:: helpText(${field}, ${help})}"></th:block>
</div>
<div class="mb-3" th:fragment="textarea(field, label, rows, max, help, required)">
    <label class="form-label" th:for="${field}">
        <span th:text="${label}"></span><span th:if="${required}" aria-hidden="true"> *</span>
    </label>
    <textarea class="form-control" th:field="*{__${field}__}" th:rows="${rows}" th:maxlength="${max}"
              th:required="${required}" th:errorclass="is-invalid"
              th:attr="aria-invalid=${#fields.hasErrors(field) ? 'true' : null}, data-counter=${field + '-counter'},
                       aria-describedby=${help != null and !help.isEmpty() ? field + '-help' + (#fields.hasErrors(field) ? ' ' + field + '-error' : '') : (#fields.hasErrors(field) ? field + '-error' : null)}"></textarea>
    <div class="form-text js-only" th:id="${field + '-counter'}"></div>
    <th:block th:replace="~{:: helpText(${field}, ${help})}"></th:block>
</div>
<div class="mb-3" th:fragment="select(field, label, options, emptyLabel, required)">
    <label class="form-label" th:for="${field}">
        <span th:text="${label}"></span><span th:if="${required}" aria-hidden="true"> *</span>
    </label>
    <select class="form-select" th:field="*{__${field}__}" th:errorclass="is-invalid" th:required="${required}"
            th:attr="aria-invalid=${#fields.hasErrors(field) ? 'true' : null},
                     aria-describedby=${#fields.hasErrors(field) ? field + '-error' : null}">
        <option value="" th:if="${emptyLabel != null}" th:text="${emptyLabel}"></option>
        <option th:each="option : ${options}" th:value="${option.id}"
                th:text="${option.active ? option.name : option.name + ' (inactive)'}"></option>
    </select>
    <th:block th:replace="~{:: helpText(${field}, null)}"></th:block>
</div>
</body>
</html>
