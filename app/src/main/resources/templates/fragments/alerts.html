<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="message(text, kind, icon, role)" th:if="${text != null}"
     class="alert alert-dismissible" th:classappend="${'alert-' + kind}" th:attr="role=${role}">
    <i class="bi" th:classappend="${icon}" aria-hidden="true"></i>
    <span th:text="${text}"></span>
    <button class="btn-close js-only" type="button" data-bs-dismiss="alert" aria-label="Dismiss"></button>
</div>
<th:block th:fragment="flash">
    <div th:replace="~{:: message(${flashSuccess}, 'success', 'bi-check-circle-fill', 'status')}"></div>
    <div th:replace="~{:: message(${flashError}, 'danger', 'bi-exclamation-triangle-fill', 'alert')}"></div>
    <div th:replace="~{:: message(${flashInfo}, 'info', 'bi-info-circle-fill', 'status')}"></div>
</th:block>
<div th:fragment="verifyBanner" class="container-lg pt-3"
     th:if="${currentUser != null and currentUser.role.toString() == 'CITIZEN' and !currentUser.mobileVerified}">
    <div class="alert alert-warning mb-0" role="region" aria-label="Mobile verification">
        <i class="bi bi-phone" aria-hidden="true"></i> Verify your mobile number to file complaints.
        <a class="alert-link" th:href="@{/verify-mobile}">Verify now</a>
    </div>
</div>
</body>
</html>
