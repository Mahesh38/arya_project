<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<span th:fragment="badge(status)" class="badge-status" th:classappend="${status.badgeClass()}">
    <i class="bi" th:classappend="${status.icon()}" aria-hidden="true"></i>
    <span th:text="${status.label()}"></span>
</span>
<span th:fragment="group(option)" class="badge-status" th:classappend="${option.badgeClass}">
    <span th:text="${option.label}"></span>
</span>
<th:block th:fragment="overdue(item)">
    <span class="badge-status badge-overdue" th:if="${item.overdue}">
        <i class="bi bi-alarm" aria-hidden="true"></i>
        Overdue <span th:text="${@fmt.days(item.daysOverdue)}"></span>
    </span>
    <span th:unless="${item.overdue}" th:text="${@fmt.date(item.dueAt)}"></span>
</th:block>
<span th:fragment="awaiting(deadline)" class="badge-status badge-awaiting" th:if="${deadline != null}">
    <i class="bi bi-hourglass-split" aria-hidden="true"></i>
    Awaiting citizen until <span th:text="${@fmt.date(deadline)}"></span>
</span>
</body>
</html>
